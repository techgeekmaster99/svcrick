<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SV Prime Cricket League — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card">
    <h1>SV PRIME CRICKET LEAGUE</h1>

    <form id="login-form">
      <label for="flat-number">Flat Number</label>
      <input type="text" id="flat-number" placeholder="A-101" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="********" autocomplete="current-password" required />

      <p class="error" id="error"></p>

      <button type="submit">Login</button>
    </form>

    <p class="hint">Default password: <strong>Admin123</strong> (you'll be asked to change it on first login)</p>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
